name: Publish NuGet Packages
# Setup: see "Publishing to NuGet" in README.md for instructions on configuring the required NUGET_API_KEY secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    # The complete test suite includes Windows image-processing tests.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Restore
        run: dotnet restore src/ClearTools.sln --source https://api.nuget.org/v3/index.json

      - name: Build (Release)
        run: dotnet build src/ClearTools.sln -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Test (required before publishing)
        run: dotnet test src/ClearTools.sln -c Release --no-build --no-restore

      - name: Pack ClearTools.Abstraction
        run: dotnet pack src/ClearTools.Abstraction/ClearTools.Abstraction.csproj -c Release --no-build -o ./artifacts

      - name: Pack ClearTools
        run: dotnet pack src/ClearTools/ClearTools.csproj -c Release --no-build -o ./artifacts

      - name: Retain tested release packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Validate NuGet API Key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "##[error]NUGET_API_KEY secret is not configured. Please add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done
