name: Validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore src/ClearTools.sln --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build src/ClearTools.sln -c Release --no-restore
      - name: Test
        run: dotnet test src/ClearTools.sln -c Release --no-build --no-restore
